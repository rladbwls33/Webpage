<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Artist List</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:"Noto Sans KR", sans-serif;
      background:#f7f7f7;
      color:#111;
    }

    /* 상단 메뉴바 */
    .navbar{
      width:100%;
      background:#0097d9;
      color:white;
      padding:16px 30px;
      display:flex;
      align-items:center;
      gap:18px;
      font-size:18px;
      font-weight:700;
    }

    .nav-item{
      cursor:pointer;
      padding:6px 12px;
      border-radius:4px;
    }
    .nav-item:hover{
      background:rgba(255,255,255,0.2);
    }

    .nav-arrow{
      color:white;
      opacity:0.9;
    }

    /* 그리드 */
    .grid{
      max-width:1200px;
      margin:40px auto;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:40px;
    }

    .artist-card{
      text-align:center;
      cursor:pointer;
      transition:.2s ease;
    }
    .artist-card:hover{
      transform:translateY(-6px);
    }

    .artist-card img{
      width:100%;
      border-radius:4px;
      border:4px solid transparent;
      transition:border .2s ease;
    }
    .artist-card:hover img{
      border:4px solid #ffb400;
    }

    .artist-name{
      margin-top:12px;
      font-size:18px;
      font-weight:700;
    }
  </style>
</head>

<body>

  <!-- 상단 메뉴바 -->
  <div class="navbar">
    <div class="nav-item" onclick="goIntro()">menu</div>
    <div class="nav-arrow">></div>
    <div class="nav-item">artist</div>
  </div>

  <!-- 예술가 리스트 -->
  <div class="grid">
    <script>
      for(let i=1;i<=8;i++){
        document.write(`
          <div class="artist-card" onclick="openArtist(${i})">
            <img src="002.png">
            <div class="artist-name">예술가 ${i}</div>
          </div>
        `);
      }
    </script>
  </div>

  <script>
    function goIntro(){
      location.href = "index.html";
    }

    function openArtist(num){
      location.href = "artist" + num + ".html";
    }
  </script>

</body>
</html>
