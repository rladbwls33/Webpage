<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>예술가 2</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:"Noto Sans KR", sans-serif;
      background:#ffffff;
      color:#111;
      line-height:1.5;
    }

    .navbar{
      width:100%;
      background:#0097d9;
      color:white;
      padding:16px 30px;
      display:flex;
      align-items:center;
      gap:18px;
      font-size:18px;
      font-weight:700;
    }
    .nav-item{ cursor:pointer; }
    .nav-arrow{ opacity:0.8; }

    .container{
      max-width:1300px;
      margin:50px auto;
      display:flex;
      gap:40px;
      padding:0 30px;
    }

    .left{
      width:45%;
    }
    .profile-img{
      width:100%;
      border:2px solid #ddd;
    }

    .right{
      flex:1;
      font-size:40px;
      font-weight:700;
    }

    .explain{
      margin-top:20px;
      font-size:26px;
      font-weight:500;
      color:#333;
      line-height:1.6;
    }

    .buttons{
      margin-top:80px;
      border:4px solid #222;
      padding:30px;
      border-radius:30px;
      font-size:32px;
      display:flex;
      flex-direction:column;
      gap:25px;
      width:450px;
    }
    .btn{
      cursor:pointer;
      padding:15px 20px;
      border-radius:18px;
      transition:.2s;
      font-size:28px;
      display:flex;
      align-items:center;
      gap:20px;
    }
    .btn:hover{
      background:#ffe7b5;
    }
  </style>
</head>

<body>

  <!-- 상단 메뉴바 -->
  <div class="navbar">
    <div class="nav-item" onclick="goHome()">menu</div>
    <div class="nav-arrow">></div>

    <div class="nav-item" onclick="goArtistList()">artist</div>
    <div class="nav-arrow">></div>

    <div class="nav-item">예술가 2</div>
  </div>

  <div class="container">
    <div class="left">
      <img src="artistN.png" alt="예술가2" class="profile-img">
    </div>

    <div class="right">
      이름 : 예술가 2<br>
      출생지 : 프랑스 파리<br>
      대표작품 : 해바라기<br>
      활동시기 : 1690~1700

      <div class="explain">
        설명 내용을 여기 쓰면 됩니다.
      </div>

      <div class="buttons">
        <div class="btn">🎨 대표 그림 보러가기</div>
        <div class="btn">🍎 생각들 보러가기</div>
      </div>
    </div>
  </div>

<script>
  function goHome(){
    location.href="index.html";
  }
  function goArtistList(){
    location.href="menu.html";
  }
</script>

</body>
</html>
